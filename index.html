<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Mishy</title>
  <meta name="description" content="A flower surprise for Mishy featuring Nailong.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Ambient floating petals & golden starlight -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Clean, minimalist audio toggle & Background Music -->
  <audio id="bg-music" src="assets/audio/Bruno%20Mars%20-%20Just%20the%20Way%20You%20Are.mp3" preload="auto" loop></audio>
  <button id="music-btn" class="audio-btn" aria-label="Toggle music">
    <span class="audio-indicator"></span>
    <span id="music-text">Music</span>
  </button>

  <!-- Golden shine explosion on box opening -->
  <div class="shine-container hidden" id="shine-container">
    <div class="shine-burst"></div>
    <div class="shine-flash"></div>
  </div>

  <main class="page-container">

    <!-- ============================================== -->
    <!-- STAGE 1: UNBOXING (FLOWER EMERGES OUT OF BOX)  -->
    <!-- ============================================== -->
    <section class="unboxing-stage" id="unboxing-stage">
      
      <!-- The Gift Box Assembly -->
      <div class="box-assembly" id="box-trigger" role="button" tabindex="0" aria-label="Open gift box">
        <div class="box-aura"></div>

        <!-- Flower that emerges and flies OUT of the box -->
        <div class="flower-escaping-box" id="flower-escaping">
          <div class="flower-escape-glow"></div>
          <img src="assets/flowermishy.svg" alt="Flowers for Mishy" class="flower-escaping-img">
        </div>

        <!-- Box Body (dissolves away afterwards) -->
        <div class="box-body" id="box-body">
          <div class="box-rim-gold"></div>
          <div class="ribbon-vertical"></div>
          <div class="ribbon-horizontal"></div>
        </div>

        <!-- Box Lid with Bow (flies off when clicked) -->
        <div class="box-lid" id="box-lid">
          <div class="ribbon-bow">
            <div class="bow-loop left"></div>
            <div class="bow-loop right"></div>
            <div class="bow-center"></div>
          </div>
          <div class="lid-surface"></div>
        </div>

        <!-- Box Floor Shadow -->
        <div class="box-floor-shadow" id="box-shadow"></div>
      </div>

    </section>

    <!-- ============================================== -->
    <!-- STAGE 2: REVEALED GILDED KEEPSAKE (BOX REMOVED)-->
    <!-- ============================================== -->
    <section class="keepsake-stage hidden" id="keepsake-stage">
      
      <!-- Master Gilded Frame -->
      <article class="keepsake-card gilded-frame">
        <div class="frame-corner top-left"></div>
        <div class="frame-corner top-right"></div>
        <div class="frame-corner bottom-left"></div>
        <div class="frame-corner bottom-right"></div>
        <div class="frame-inner-border"></div>

        <!-- Header -->
        <header class="keepsake-header">
          <h1 class="keepsake-title">
            <svg class="title-sparkle left" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="star-gold-1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fffdf2" />
                  <stop offset="45%" stop-color="#fec84d" />
                  <stop offset="100%" stop-color="#e59c1e" />
                </linearGradient>
              </defs>
              <path d="M12 0C12 7.2 16.8 12 24 12C16.8 12 12 16.8 12 24C12 16.8 7.2 12 0 12C7.2 12 12 7.2 12 0Z" fill="url(#star-gold-1)"/>
            </svg>
            <span class="title-text">For Mishy</span>
            <svg class="title-sparkle right" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="star-gold-2" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fffdf2" />
                  <stop offset="45%" stop-color="#fec84d" />
                  <stop offset="100%" stop-color="#e59c1e" />
                </linearGradient>
              </defs>
              <path d="M12 0C12 7.2 16.8 12 24 12C16.8 12 12 16.8 12 24C12 16.8 7.2 12 0 12C7.2 12 12 7.2 12 0Z" fill="url(#star-gold-2)"/>
            </svg>
          </h1>
          <p class="keepsake-subtitle" id="keepsake-subtitle">An eternal bouquet, blooming just for you</p>
        </header>

        <!-- Composition: Flower + Nailong side-by-side -->
        <div class="scene-composition" id="scene-composition">
          <div class="scene-backlight"></div>

          <!-- Flower Bouquet Showcase (Interactive on click) -->
          <div class="flower-wrapper" id="flower-trigger" role="button" tabindex="0" title="Tap flowers to bloom">
            <div class="bloom-aura" id="bloom-aura"></div>
            <img src="assets/flowermishy.svg" alt="Flowers for Mishy" class="flower-img" id="flower-img">
            <div class="flower-ground-glow"></div>
          </div>

          <!-- Nailong Companion beside flowers -->
          <div class="nailong-companion" id="nailong-trigger" role="button" tabindex="0" title="Tap Nailong">
            <div class="nailong-character">
              <span class="nailong-love-bubble" id="nailong-love-bubble">♥</span>
              <img src="assets/nailong.svg" alt="Nailong" class="nailong-img" id="nailong-img">
            </div>
            <div class="nailong-ground-shadow"></div>
          </div>
        </div>

        <!-- Retro Indie RPG Dialogue Box across the bottom -->
        <div class="bottom-dialogue-container" id="dialogue-container">
          <div class="nailong-bubble pixel-dialogue-box" id="speech-box" role="button" tabindex="0" title="Tap dialogue to advance">
            <div class="dialogue-box-corner tl"></div>
            <div class="dialogue-box-corner tr"></div>
            <div class="dialogue-box-corner bl"></div>
            <div class="dialogue-box-corner br"></div>
            <div class="dialogue-nametag">
              <span class="pixel-sparkle">✦</span> NAILONG
            </div>
            <p class="dialogue-text" id="dialogue-text">Hi Mishy! I brought these flowers just for you. Tap me whenever you want a sweet reminder.</p>
            <div class="dialogue-footer-hint">
              <span class="dialogue-prompt-label">TAP TO CONTINUE</span>
              <span class="dialogue-caret ready" id="dialogue-caret" aria-hidden="true">▼</span>
            </div>
          </div>
        </div>
      </article>

    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
